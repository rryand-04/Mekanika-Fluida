<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroPower Engineering Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            background-image: url('https://www.transparenttextures.com/patterns/mathematical-formulas.png');
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 1.5rem;
        }
        
        /* Animasi Aliran Air */
        .flow-line { 
            stroke-dasharray: 8; 
            animation: flow-move 1s linear infinite; 
        }
        @keyframes flow-move { 
            from { stroke-dashoffset: 16; } 
            to { stroke-dashoffset: 0; } 
        }

        /* Rotasi Turbin */
        #v-turbine {
            transform-box: fill-box;
            transform-origin: center;
            will-change: transform;
        }

        /* Animasi Kabel Listrik */
        .electric-flow {
            stroke-dasharray: 8 8;
            animation: electric-move linear infinite;
        }
        @keyframes electric-move {
            to { stroke-dashoffset: -16; } /* Nilai negatif agar mengalir ke kanan */
        }

        /* Animasi Gardu Listrik (Glow & Pulse) */
        .grid-pulse {
            animation: pulse-glow 1.5s infinite alternate;
        }
        @keyframes pulse-glow {
            from { filter: drop-shadow(0 0 2px #047857); }
            to { filter: drop-shadow(0 0 15px #34d399); }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-10 flex justify-between items-end border-b border-slate-700 pb-6">
            <div>
                <h1 class="text-4xl font-extrabold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">HydroPower Calculator</h1>
                <p class="text-slate-500 text-sm mt-1">Sistem Simulasi Konversi Energi Terbarukan</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- PANEL INPUT -->
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-panel p-6 shadow-2xl">
                    <h3 class="text-lg font-bold mb-6 flex items-center gap-2 border-b border-slate-700 pb-4">
                        <span>🎛️</span> Control Station
                    </h3>
                    
                    <div class="space-y-8">
                        <div>
                            <label class="flex justify-between text-sm mb-2">
                                <span>Debit Air (Q)</span>
                                <b class="text-blue-400" id="lbl-debit">20 m³/s</b>
                            </label>
                            <input type="range" id="in-debit" min="0" max="150" value="20" class="w-full accent-blue-500" oninput="jalankanSimulasi()">
                        </div>

                        <div>
                            <label class="flex justify-between text-sm mb-2">
                                <span>Head / Tinggi Jatuh (H)</span>
                                <b class="text-blue-400" id="lbl-head">50 m</b>
                            </label>
                            <input type="range" id="in-head" min="5" max="300" value="50" class="w-full accent-blue-500" oninput="jalankanSimulasi()">
                        </div>

                        <div>
                            <label class="flex justify-between text-sm mb-2">
                                <span>Efisiensi Generator (η)</span>
                                <b class="text-blue-400" id="lbl-eta">0.85</b>
                            </label>
                            <input type="range" id="in-eta" min="0.1" max="1" step="0.01" value="0.85" class="w-full accent-blue-500" oninput="jalankanSimulasi()">
                        </div>
                    </div>
                </div>

                <div class="glass-panel p-6 border-l-4 border-blue-500">
                    <h4 class="text-sm font-bold text-blue-400 uppercase tracking-tighter mb-3">Laporan Analisis Fisika</h4>
                    <div id="teks-analisis" class="text-sm text-slate-300 leading-relaxed space-y-3"></div>
                </div>
            </div>

            <!-- PANEL VISUAL -->
            <div class="lg:col-span-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="glass-panel p-4 text-center">
                        <p class="text-[10px] uppercase text-slate-500">Daya Potensial</p>
                        <p class="text-xl font-bold" id="out-pot">0 kW</p>
                    </div>
                    <div class="glass-panel p-4 text-center border-t-2 border-emerald-500 shadow-[0_-5px_20px_rgba(16,185,129,0.2)]">
                        <p class="text-[10px] uppercase text-emerald-500 font-bold">Output Listrik</p>
                        <p class="text-2xl font-black text-white" id="out-listrik">0 kW</p>
                    </div>
                    <div class="glass-panel p-4 text-center">
                        <p class="text-[10px] uppercase text-slate-500">Energi Terbuang</p>
                        <p class="text-xl font-bold text-red-400" id="out-loss">0 kW</p>
                    </div>
                </div>

                <!-- DIAGRAM SISTEM -->
                <div class="glass-panel p-4 overflow-hidden flex flex-col items-center justify-center min-h-[450px]">
                    <svg viewBox="0 0 800 450" class="w-full h-full">
                        <!-- Water Reservoir (Wadah) -->
                        <rect x="50" y="100" width="150" height="250" fill="#1e293b" />
                        <!-- Dinamic Water Level -->
                        <rect id="v-water" x="50" y="100" width="150" height="0" fill="#3b82f6" fill-opacity="0.6" />
                        <text x="50" y="90" fill="#94a3b8" font-size="10" font-weight="bold">DAM / RESERVOIR</text>

                        <!-- Penstock (Pipa) -->
                        <path d="M 200 320 Q 350 320 460 360" stroke="#334155" stroke-width="24" fill="none" />
                        <path id="v-flow" d="M 200 320 Q 350 320 460 360" stroke="#60a5fa" stroke-width="14" fill="none" class="flow-line" />

                        <!-- Turbine Housing -->
                        <circle cx="500" cy="360" r="45" fill="#334155" />
                        
                        <!-- Turbine Baling-baling -->
                        <g id="v-turbine">
                            <line x1="500" y1="330" x2="500" y2="390" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
                            <line x1="470" y1="360" x2="530" y2="360" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
                            <circle cx="500" cy="360" r="12" fill="#d97706" />
                        </g>

                        <!-- Shaft & Generator -->
                        <rect x="540" y="355" width="40" height="10" fill="#94a3b8" /> 
                        <rect x="580" y="320" width="100" height="80" fill="#475569" rx="4" />
                        <circle cx="630" cy="360" r="25" fill="#1e293b" stroke="#64748b" /> 
                        <text x="585" y="310" fill="#cbd5e1" font-size="9">GENERATOR UNIT</text>
                        
                        <!-- Power Line (Diubah untuk bisa dianimasikan) -->
                        <path id="v-grid-line" d="M 680 360 L 750 360 L 750 200" stroke="#10b981" stroke-width="4" fill="none" />
                        
                        <!-- Power Grid Box (Ditambahkan ID) -->
                        <g id="v-grid-box">
                            <rect x="720" y="150" width="60" height="50" fill="#064e3b" rx="4" stroke="#10b981" stroke-width="2" />
                            <text x="726" y="140" fill="#10b981" font-size="10" font-weight="bold">POWER GRID</text>
                            <circle cx="750" cy="175" r="8" fill="#10b981" />
                        </g>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        let rotasi_turbin = 0;
        window.debit_saat_ini = 20;

        function jalankanSimulasi() {
            // Mengambil inputan
            const debit_air = parseFloat(document.getElementById('in-debit').value);
            const tinggi_jatuh = parseFloat(document.getElementById('in-head').value);
            const efisiensi = parseFloat(document.getElementById('in-eta').value);
            
            window.debit_saat_ini = debit_air;

            // Memperbarui Teks Label UI
            document.getElementById('lbl-debit').innerText = debit_air + " m³/s";
            document.getElementById('lbl-head').innerText = tinggi_jatuh + " m";
            document.getElementById('lbl-eta').innerText = efisiensi;

            // Rumus Fisika Tenaga Air
            const gravitasi = 9.81;
            const massa_jenis_air = 1000;
            const daya_potensial = (massa_jenis_air * gravitasi * debit_air * tinggi_jatuh) / 1000; // dalam kW
            const daya_listrik = daya_potensial * efisiensi;
            const energi_terbuang = daya_potensial - daya_listrik;

            // Update Panel Output
            document.getElementById('out-pot').innerText = Math.round(daya_potensial).toLocaleString('id-ID') + " kW";
            document.getElementById('out-listrik').innerText = Math.round(daya_listrik).toLocaleString('id-ID') + " kW";
            document.getElementById('out-loss').innerText = Math.round(energi_terbuang).toLocaleString('id-ID') + " kW";

            // Visual 1: Ketinggian Air di Dam
            const tinggi_maksimal_visual = 250;
            const tinggi_visual_saat_ini = (tinggi_jatuh / 300) * tinggi_maksimal_visual;
            const sumbu_y_baru = 350 - tinggi_visual_saat_ini;

            gsap.to("#v-water", { 
                attr: { y: sumbu_y_baru, height: tinggi_visual_saat_ini }, 
                duration: 0.5,
                ease: "power2.out"
            });

            // Visual 2: Kecepatan Aliran Air ke Pipa
            const elemen_aliran = document.getElementById('v-flow');
            if (debit_air > 0) {
                elemen_aliran.style.display = "block";
                const kecepatan_aliran = 2 - (debit_air / 150 * 1.85); 
                elemen_aliran.style.animationDuration = kecepatan_aliran + "s";
            } else {
                elemen_aliran.style.display = "none";
            }

            // Visual 3: Animasi Kabel Listrik & Grid
            const jalur_kabel = document.getElementById('v-grid-line');
            const kotak_grid = document.getElementById('v-grid-box');
            
            if (daya_listrik > 0) {
                jalur_kabel.classList.add('electric-flow');
                kotak_grid.classList.add('grid-pulse');
                
                // Semakin besar daya, arus animasi mengalir makin cepat
                const kecepatan_listrik = Math.max(0.1, 1.5 - (daya_listrik / 50000));
                jalur_kabel.style.animationDuration = kecepatan_listrik + "s";
                kotak_grid.style.animationDuration = kecepatan_listrik + "s";
            } else {
                jalur_kabel.classList.remove('electric-flow');
                kotak_grid.classList.remove('grid-pulse');
            }

            // Panggil fungsi laporan analisis
            perbaruiLaporanAnalisis(debit_air, tinggi_jatuh, efisiensi, daya_listrik);
        }

        function perbaruiLaporanAnalisis(debit, head, efisiensi, listrik) {
            let html_analisis = "";
            
            // 1. Analisis Ketinggian (Head)
            if (head >= 150) {
                html_analisis += `<p>🟢 <b>Head Tinggi (${head}m):</b> Energi potensial gravitasi sangat besar. Sangat ideal memanfaatkan tekanan hidrostatik kuat untuk menghantam sudut turbin impuls (seperti tipe Pelton).</p>`;
            } else if (head >= 50) {
                html_analisis += `<p>🟡 <b>Head Menengah (${head}m):</b> Tekanan air stabil. Konfigurasi ini paling cocok menggunakan turbin reaksi tipe Francis yang mengolah energi dari tekanan sekaligus aliran air.</p>`;
            } else {
                html_analisis += `<p>⚪ <b>Head Rendah (${head}m):</b> Tekanan air minim. Sistem terpaksa mengandalkan volume aliran air yang besar untuk memutar baling-baling turbin (cocok untuk tipe Kaplan).</p>`;
            }

            // 2. Analisis Debit Air (Q)
            if (debit >= 100) {
                html_analisis += `<p>🌊 <b>Debit Masif (${debit} m³/s):</b> Aliran air luar biasa deras. Massa air mentransfer momen gaya (torsi) yang sangat kuat pada poros turbin.</p>`;
            } else if (debit >= 30) {
                html_analisis += `<p>💧 <b>Debit Normal (${debit} m³/s):</b> Volume air cukup untuk menggerakkan sistem generator pada kecepatan putaran (RPM) yang stabil.</p>`;
            } else {
                html_analisis += `<p>💧 <b>Debit Minim (${debit} m³/s):</b> Aliran air terbatas. Sistem harus memiliki ketinggian (Head) ekstra ekstrem untuk menutupi minimnya pasokan air ini.</p>`;
            }
            
            // 3. Analisis Efisiensi (η)
            if (efisiensi >= 0.85) {
                html_analisis += `<p>✨ <b>Sistem Optimal (η = ${efisiensi}):</b> Konversi berjalan nyaris sempurna! Rugi-rugi daya seperti gesekan bearing mekanik dan panas induksi pada kawat tembaga sangat terkendali.</p>`;
            } else if (efisiensi >= 0.6) {
                html_analisis += `<p>⚙️ <b>Efisiensi Standar (η = ${efisiensi}):</b> Pembangkit beroperasi normal, namun sebagian besar energi terpaksa hilang menjadi panas atau suara bising operasional.</p>`;
            } else {
                html_analisis += `<p>🔴 <b>Rugi Daya Masif (η = ${efisiensi}):</b> Kritis. Sistem membuang terlalu banyak energi. Terdapat indikasi aus mekanik parah atau resistansi tinggi pada kumparan generator.</p>`;
            }
            
            // 4. Kesimpulan Output Rumah Tangga
            // Asumsi 1 Rumah menggunakan daya listrik 450 Watt (0.45 kW)
            const estimasi_rumah = Math.floor(listrik / 0.45);
            html_analisis += `
                <div class="mt-4 p-3 bg-emerald-500/10 rounded-lg text-xs border border-emerald-500/30">
                    <b class="text-emerald-400">Kesimpulan Distribusi:</b> Kapasitas produksi listrik aktual sebesar <b>${Math.round(listrik).toLocaleString('id-ID')} kW</b> saat ini mampu menerangi sekitar <b>${estimasi_rumah.toLocaleString('id-ID')} rumah</b> (berdasarkan standar 450 VA).
                </div>`;
                
            document.getElementById('teks-analisis').innerHTML = html_analisis;
        }

        // Animasi Loop Turbin (Berjalan terus menerus)
        function animasi_berjalan() {
            if (window.debit_saat_ini > 0) {
                const kecepatan_putar = window.debit_saat_ini * 0.15; 
                rotasi_turbin += kecepatan_putar;
                document.getElementById('v-turbine').style.transform = `rotate(${rotasi_turbin}deg)`;
            }
            requestAnimationFrame(animasi_berjalan);
        }

        // Jalankan saat pertama kali dimuat
        jalankanSimulasi();
        animasi_berjalan();
    </script>
</body>
</html>
